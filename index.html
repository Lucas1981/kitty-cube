<!doctype html>
<!--
  Catcube – Gouraud shading and texturing on a cat photo cube.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Catcube</title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        background: black;
      }
      h4 {
        margin: 0;
        padding: 2px 0;
      }
      #header {
        background: white;
        width: 100%;
        float: left;
      }
      #content {
        background: grey;
        width: 100%;
        float: left;
        padding-top: 10px;
      }
      #footer {
        background: black;
        color: white;
        width: 100%;
        float: left;
      }
      .container {
        width: 1280px;
        margin-left: auto;
        margin-right: auto;
      }
      .controls {
        width: 320px;
        float: left;
      }
      .control {
        width: 300px;
        min-height: 100px;
        background: white;
        margin: 5px;
        padding: 5px;
      }
      #canvas {
        margin: 0 320px 0 320px;
        padding: 0;
        border-radius: 10px;
        background: #000000;
        width: 640px;
        height: 480px;
      }
      #fps-display {
        margin: 4px 320px 0 320px;
        font-family: monospace;
        font-size: 14px;
        color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div class="container">
        <h1>Catcube</h1>
      </div>
    </div>
    <div id="content">
      <div class="container">
        <canvas id="canvas">Not supported</canvas>
        <div id="fps-display">FPS: —</div>
        <div>
          <span id="z0"></span> <span id="z1"></span> <span id="z2"></span>
        </div>
      </div>
    </div>
    <div id="footer">
      <div class="container">
        <p>&copy; Lucas van Heerikhuizen, 2026</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
