<!doctype html>
<!--
  Catcube – Gouraud shading and texturing on a cat photo cube.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Catcube</title>
    <style type="text/css">
      body {
        margin: 0;
        padding: 0;
        background: black;
      }
      h4 {
        margin: 0;
        padding: 2px 0;
      }
      #header {
        background: white;
        width: 100%;
        float: left;
      }
      #content {
        background: grey;
        width: 100%;
        float: left;
      }
      #content .container {
        display: flex;
        align-items: flex-start;
        padding-top: 10px;
      }
      .spacer {
        flex: 0 0 320px;
      }
      .canvas-area {
        flex: 0 0 640px;
      }
      #footer {
        background: black;
        color: white;
        width: 100%;
        float: left;
      }
      .container {
        width: 1280px;
        margin-left: auto;
        margin-right: auto;
      }
      .controls {
        width: 320px;
        float: left;
      }
      .control {
        width: 300px;
        min-height: 100px;
        background: white;
        margin: 5px;
        padding: 5px;
      }
      #canvas {
        display: block;
        padding: 0;
        border-radius: 10px;
        background: #000000;
        width: 640px;
        height: 480px;
      }
      #fps-display {
        margin-top: 4px;
        font-family: monospace;
        font-size: 14px;
        color: #eee;
      }
      .controls {
        flex: 0 0 320px;
        padding: 0 10px;
        box-sizing: border-box;
      }
      .control {
        background: white;
        border-radius: 6px;
        padding: 10px 14px;
      }
      .control h4 {
        margin: 0 0 8px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #555;
      }
      .control label {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 4px 0;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div class="container">
        <h1>Catcube</h1>
      </div>
    </div>
    <div id="content">
      <div class="container">
        <div class="spacer"></div>
        <div class="canvas-area">
          <canvas id="canvas">Not supported</canvas>
          <div id="fps-display">FPS: —</div>
        </div>
        <div class="controls">
          <div class="control">
            <h4>Render mode</h4>
            <label>
              <input type="radio" name="render-mode" value="flat">
              Flat shading
            </label>
            <label>
              <input type="radio" name="render-mode" value="gouraud">
              Gouraud
            </label>
            <label>
              <input type="radio" name="render-mode" value="gouraud-texture" checked>
              Gouraud + Texture
            </label>
          </div>
        </div>
      </div>
    </div>
    <div id="footer">
      <div class="container">
        <p>&copy; Lucas van Heerikhuizen, 2026</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
